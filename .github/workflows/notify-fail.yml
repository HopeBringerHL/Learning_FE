name: Notify Pipeline Failure

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  notify-discord:
    name: Notify Discord
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      ACTOR: ${{ github.event.workflow_run.actor.login }}
      LOG_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - name: Send Discord notification
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is empty. Skip notification."
            exit 0
          fi

          payload=$(cat <<PAYLOAD
          {
            "username": "Hope Bringer CI",
            "content": "❌ CI workflow failed\nRepository: ${REPO}\nBranch: ${BRANCH}\nTriggered by: ${ACTOR}\nLogs: ${LOG_URL}"
          }
          PAYLOAD
          )

          curl --fail-with-body --silent --show-error -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"